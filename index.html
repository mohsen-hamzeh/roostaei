<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کشتارگاه صنعتی دام روستائی</title>
    <meta name="description" content="کشتارگاه صنعتی دام روستائی داودآباد اراک؛ کشتار دام سبک و سنگین، شتر و شترمرغ با بالاترین استانداردهای بهداشتی. منبع گوشت تازه و سالم." />
    <meta name="theme-color" content="#61002b" />
    <meta property="og:title" content="کشتارگاه صنعتی دام روستائی" />
    <meta property="og:description" content="منبع گوشت تازه و سالم — داودآباد، اراک" />
    <meta property="og:image" content="/images/brand/pr-banner.webp" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
